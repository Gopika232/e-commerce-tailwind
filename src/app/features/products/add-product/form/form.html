<div class="rounded-2xl overflow-hidden shadow-2xl bg-slate-100">

  <!-- 🌈 Header -->
  <div
    class="bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 px-6 py-4"
  >
    <h3 class="text-center text-2xl font-extrabold text-white tracking-wide">
      {{ data.mode === 'add' ? 'Add Product' : 'Edit Product' }}
    </h3>
  </div>

  <!-- 📦 Content -->
  <mat-dialog-content
    [formGroup]="form"
    class="p-6 grid grid-cols-1 md:grid-cols-2 gap-5 bg-gradient-to-br from-slate-50 to-slate-200"
  >

    <mat-form-field appearance="outline"
      class="bg-white rounded-xl shadow-sm">
      <mat-label>Product Name</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>

    <mat-form-field appearance="outline"
      class="bg-white rounded-xl shadow-sm">
      <mat-label>Price (₹)</mat-label>
      <input matInput type="number" formControlName="price" />
    </mat-form-field>

    <mat-form-field appearance="outline"
      class="bg-white rounded-xl shadow-sm">
      <mat-label>Stock</mat-label>
      <input matInput type="number" formControlName="stock" />
    </mat-form-field>

    <mat-form-field appearance="outline"
      class="bg-white rounded-xl shadow-sm">
      <mat-label>Category</mat-label>
      <mat-select formControlName="category">
        <mat-option *ngFor="let cat of categories" [value]="cat">
          {{ cat }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Full Width -->
    <mat-form-field appearance="outline"
      class="md:col-span-2 bg-white rounded-xl shadow-sm">
      <mat-label>Description</mat-label>
      <textarea matInput rows="3" formControlName="description"></textarea>
    </mat-form-field>

  </mat-dialog-content>

  <!-- 🎯 Actions -->
  <mat-dialog-actions
    align="end"
    class="px-6 py-4 bg-slate-100 border-t border-slate-300 flex gap-3"
  >
    <button
      mat-stroked-button
      class="!border-rose-500 !text-rose-600 hover:!bg-rose-50"
      (click)="dialogRef.close()"
    >
      Cancel
    </button>

    <button
      mat-raised-button
      class="!bg-emerald-500 hover:!bg-emerald-600 !text-white"
      [disabled]="form.invalid"
      (click)="save()"
    >
      {{ data.mode === 'add' ? 'Add Product' : 'Update Product' }}
    </button>
  </mat-dialog-actions>

</div>
