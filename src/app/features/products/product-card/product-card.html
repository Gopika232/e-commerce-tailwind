<div
  class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-md hover:shadow-xl transition flex flex-col h-full">

  <!-- Image -->
  <img
    [src]="product.image"
    alt="{{ product.name }}"
    class="w-full h-40 object-cover rounded-lg mb-3"
  />

  <!-- Product Info -->
  <h3 class="font-semibold text-white text-lg truncate">
    {{ product.name }}
  </h3>

  <p class="text-indigo-400 font-bold mt-1">
    ₹{{ product.price }}
  </p>

  <!-- Spacer -->
  <div class="flex-grow"></div>

  <!-- Actions -->
  <div class="mt-4 flex flex-col gap-2">
<div class="flex gap-2">
    <!-- Add to Cart -->
    <button
      (click)="add(product)"
      type="button"
      class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg transition">
      Add to Cart
    </button>
<button
  (click)="toggleWishlist(product)"
  class="text-xl"
  [class.text-red-500]="isWishlisted(product)"
>
  ♥
</button>
</div>

    <!-- Edit / Delete -->
    <div class="flex gap-2">
      <button
        (click)="edit(product)"
        class="flex-1 bg-amber-500 hover:bg-amber-600 text-black py-2 rounded-lg transition">
        Edit
      </button>

      <button
        (click)="delete(product)"
        class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg transition">
        Delete
      </button>
    </div>

  </div>
</div>
