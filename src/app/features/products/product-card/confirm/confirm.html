<div class="max-w-md mx-auto rounded-2xl shadow-2xl overflow-hidden bg-white">

  <!-- ⚠️ Header -->
  <div class="bg-gradient-to-r from-red-500 to-orange-500 px-6 py-4">
    <h3 class="text-center text-xl font-extrabold text-white tracking-wide">
      {{ data.title }}
    </h3>
  </div>

  <!-- 🧾 Content -->
  <div class="p-6 text-center bg-gradient-to-br from-red-50 to-orange-50">

    <!-- Warning Icon -->
    <div class="flex justify-center mb-4">
      <div
        class="w-16 h-16 rounded-full bg-red-100 flex items-center justify-center"
      >
        <span class="text-3xl text-red-600">⚠️</span>
      </div>
    </div>

    <p class="text-red-600 text-lg font-semibold mb-2">
      Really want to delete this product?
    </p>

    <p class="text-slate-600 mb-6">
      {{ data.message }}
    </p>

    <!-- 🎯 Actions -->
    <div class="flex justify-center gap-4">
      <button
        mat-stroked-button
        class="!border-slate-400 !text-slate-600 hover:!bg-slate-100 px-6"
        (click)="close()"
      >
        No
      </button>

      <button
        mat-raised-button
        class="!bg-red-500 hover:!bg-red-600 !text-white px-6"
        (click)="confirm()"
      >
        Yes, Delete
      </button>
    </div>

  </div>
</div>
