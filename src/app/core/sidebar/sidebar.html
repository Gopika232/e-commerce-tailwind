<div class="bg-white p-5 rounded-xl shadow-lg w-64 min-h-screen border border-gray-200">

  <!-- MENU -->
  <h3 class="font-bold text-gray-700 mb-4 text-lg tracking-wide">
    MENU
  </h3>

  <ul class="space-y-3 mb-8">
    <li>
      <button class="text-gray-700 mb-4 text-lg tracking-wide cursor-pointer hover:text-violet-700"
        type="button">Dashboard</button>
    </li>
    <li>
      <button class="text-gray-700 mb-4 text-lg tracking-wide cursor-pointer hover:text-violet-700"
        type="button">User</button>
    </li>
    <li>

      <!-- CATEGORIES HEADER -->
      <h6 (click)="showSection('categories')"
        class="text-gray-700 mb-4 text-lg tracking-wide cursor-pointer hover:text-violet-700">
        Categories
      </h6>

      <!-- CATEGORIES LIST -->
      <ul *ngIf="activeSection === 'categories'" class="space-y-2 mb-6">
        <li *ngFor="let category of categories" (click)="selectCategory(category)" class="cursor-pointer px-4 py-2 rounded-lg text-gray-600 font-medium
             hover:bg-violet-100 hover:text-violet-700 transition">
          {{ category }}
        </li>
      </ul>
    </li>
    <li>
      <!-- LISTS HEADER -->
      <h6 (click)="showSection('lists')"
        class="text-gray-700 mb-4 text-lg tracking-wide cursor-pointer hover:text-violet-700">
        Lists
      </h6>

      <!-- LISTS -->
      <div *ngIf="activeSection === 'lists'" class="space-y-2">
        <button class="w-full text-left px-4 py-2 rounded-lg font-medium text-gray-700
               hover:bg-violet-900 hover:text-white transition" type="button">
          Wishlist
        </button>
        <button class="w-full text-left px-4 py-2 rounded-lg font-medium text-gray-700
               hover:bg-violet-900 hover:text-white transition" type="button">
          Cartlist
        </button>
        <button class="w-full text-left px-4 py-2 rounded-lg font-medium text-gray-700
               hover:bg-violet-900 hover:text-white transition" type="button">
          Orderlist
        </button>
      </div>
    </li>
    <li>
      <button class="text-gray-700 mb-4 text-lg tracking-wide cursor-pointer hover:text-violet-700"
        type="button">Reports</button>
    </li>
  </ul>
</div>
